# SonarCloud properties for a React + Vite project

# # Organization key (replace with your actual organization key)
# sonar.organization=your-organization-key

# # Project key (replace with your actual project key)
# sonar.projectKey=your-project-key

# # Project name
# sonar.projectName=your-project-name

# Project version
sonar.projectVersion=1.0

# Source directories
sonar.sources=src

# Exclude test files and build output
sonar.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/node_modules/**,**/dist/**,**/build/**

# Language
sonar.language=js

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Enable coverage if you use a tool like vitest or jest
# sonar.javascript.lcov.reportPaths=coverage/lcov.info